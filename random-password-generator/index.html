<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body
    class="min-h-screen min-w-[1000px] bg-[#101b16] font-sans text-[#f0fdf4]"
  >
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header
        class="flex h-24 shrink-0 items-center justify-between border-b border-[#86efac]/10"
      >
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#86efac]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#86efac] transition-colors hover:border-[#86efac]/35 hover:bg-[#86efac]/10 hover:text-[#f0fdf4] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#86efac] motion-reduce:transition-none"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span
          class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#86efac]/65"
          >The everyday collection / 02</span
        >
      </header>

      <div class="flex flex-1 items-center justify-center py-10">
        <div
          class="w-[520px] h-[571px] rounded-[24px] border-[1px] border-[#FFFFFF1A] bg-[#192B22] shadow-[0px_25px_50px_-12px_rgba(0,0,0,0.25)] p-[36px]"
        >
          <div
            class="w-[44px] h-[44px] rounded-[12px] bg-[#4ADE8026] flex justify-center items-center"
          >
            <div>
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <rect
                  x="5"
                  y="10"
                  width="14"
                  height="11"
                  rx="2"
                  stroke="#75E6A0"
                  stroke-width="2"
                />
                <path
                  d="M8 10V7a4 4 0 0 1 8 0v3"
                  stroke="#75E6A0"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <circle cx="12" cy="15" r="1" fill="#75E6A0" />
                <path
                  d="M12 16v2"
                  stroke="#75E6A0"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </div>
          </div>
          <div class="w-[273px] h-[34px] text-[28px] text-[#F0FDF4] mt-[24px]">
            Password generator
          </div>
          <div class="w-[235px] h-[17px] text-[14px] text-[#A4B9AD] mt-[8px]">
            A strong password. One click away.
          </div>
          <div class="w-[85px] h-[15px] text-[12px] text-[#A4B9AD] mt-[32px]">
            Your password
          </div>
          <div
            class="h-[64px] rounded-[12px] border border-[#FFFFFF1A] justify-between flex pr-[12px] pl-[16px] bg-[#101B16] items-center mt-[12px]"
          >
            <input
              readonly
              type="text"
              id="password-generator"
              class="flex-1 text-[18px] text-[#BBF7D0]"
            />

            <button
              id="copy-button"
              type="button"
              class="text-[12px] text-[#DCECE2] cursor-pointer w-[55px] h-[31px] rounded-[8px] bg-[#FFFFFF0D] hover:bg-white/10"
            >
              Copy
            </button>
          </div>
          <div
            id="copy-button-text"
            class="w-[207px] h-[15px] text-[12px] text-[#A4B9AD] mt-[12px]"
          >
            Uses letters, numbers, and symbols.
          </div>
          <div class="w-[448px] h-[28px] flex justify-between">
            <div
              class="w-[111px] h-[17px] text-[14px] text-[#DCECE2] mt-[24px]"
            >
              Password length
            </div>
            <div
              id="password-length"
              class="w-[22px] h-[24px] text-[18px] text-[#86EFAC] mt-[23px]"
            >
              16
            </div>
          </div>

          <input
            type="range"
            min="8"
            max="24"
            value="16"
            id="password-length-cursor"
            class="mt-4 w-full cursor-pointer accent-[#4ade80] mt-[24px]"
          />
          <div class="w-[448px] h-[16px] justify-between flex mt-[4px]">
            <div class="w-[8px] h-[15px] text-[12px] text-[#8AA294]">8</div>
            <div class="w-[15px] h-[15px] text-[12px] text-[#8AA294]">24</div>
          </div>

          <button
            id="generate-password"
            type="button"
            class="w-[448px] h-[48px] mt-[28px] rounded-[12px] bg-[#4ADE80] text-[14px] cursor-pointer hover:bg-[#86efac] text-[#102418]"
          >
            Generate Password
          </button>

          <div class="w-[448px] h-[16px] flex justify-center mt-[20px]">
            <p class="text-[12px] text-[#8AA294]">
              Generated in your browser. Never saved.
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
