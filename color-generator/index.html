<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body
    class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]"
  >
    <div class="mx-auto flex min-h-screen w-[1240px] flex-col">
      <header
        class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10"
      >
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d] motion-reduce:transition-none"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span
          class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65"
          >The everyday collection / 03</span
        >
      </header>

      <div class="flex flex-1 items-center justify-center py-10">
        <div class="w-[1204px] h-[104px] flex justify-between">
          <div class="w-[620px] h-[65px] flex gap-[12px] flex-col ">
            <div class="text-[30px] text-[#F4F4F5]">Color palettes.</div>
            <div class="text-[14px] text-[#A1A1AA]">Generated shades with Tailwind color names. Click a shade to copy its HEX background color.</div>
          </div>
          <div class="w-[186px] h-[48px] flex gap-[8px] rounded-[12px] bg-[#D9F99D] items-center justify-center">
            <div></div>
            <div class="w-[108px] h-[17px] text-[14px] text-[#09090B]">Shuffle palettes</div>
          </div>
        </div>
        <div></div>
        <div></div>
      </div>
    </div>
  </body>
</html>
