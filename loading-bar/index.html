<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading · Forma</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="flex items-center justify-center flex-col bg-[#190B10]">
    <div
      class="w-[1140px] h-[960px] flex items-center justify-center flex-col bg-[#190B10]"
    >
      <div class="w-[230px] h-[12px] text-[10px] text-[#C4A2AB] tracking-[3px]">
        — LET’S GET YOU STARTED —
      </div>
      <div
        class="w-[720px] h-[456px] border-[1px] border-[#46232E] rounded-[24px] flex flex-col justify-center bg-[#260F17] mt-[24px]"
      >
        <div
          class="w-[720px] h-[398px] pt-[40px] pr-[48px] pb-[36px] pl-[48px]"
        >
          <div class="w-[624px] h-[28px] flex justify-between">
            <p class="text-[#FF9299] text-[10px] tracking-[1.5px]">
              GETTING READY
            </p>
            <p class="text-[#C4A2AB] text-[11px]">01 — 03</p>
          </div>
          <div w-[483px] h-[48px] mt-[28px]>
            <p class="text-[#FFF5EE] text-[40px] tracking-[-1.8px]">
              Something good is coming.
            </p>
          </div>
          <div class="w-[287px] h-[18px] mt-[12px]">
            <p class="text-[#C4A2AB] text-[15px]">
              A little preparation for a great beginning.
            </p>
          </div>
          <div
            class="w-[624px] h-[112px] flex justify-between items-center mt-[36px]"
          >
            <div class="flex gap-[8px] items-baseline">
              <div
                id="counter"
                class="min-w-[138px] h-[136px] text-[#FFF5EE] flex items-center text-[112px]"
              >
                64
              </div>
              <div class="w-[31px] h-[46px] text-[#FF6470] text-[38px]">%</div>
            </div>
            <div
              id="message"
              class="w-[190px] h-[17px] text-[14px] text-[#C4A2AB]"
            >
              Bringing everything together
            </div>
          </div>
          <div class="w-[624px] h-[12px] rounded-[6px] bg-[#46232E] mt-[24px]">
            <div
              id="loadingbar"
              class="w-0 h-[12px] rounded-[6px] bg-[#EF3340]"
            ></div>
          </div>
          <div class="w-[624px] h-[16px] flex justify-between mt-[14px]">
            <div class="h-[12px] text-[10px] text-[#C4A2AB] tracking-[1px]">
              PREPARING YOUR EXPERIENCE
            </div>
            <div class="h-[12px] text-[10px] text-[#C4A2AB] tracking-[1px]">
              JUST A MOMENT
            </div>
          </div>
        </div>
        <div
          class="h-[56px] flex justify-center items-center bg-[#1E0C13] rounded-bl-[24px] rounded-br-[24px]"
        >
          <p class="w-[265px] h-[15px] text-[12px] text-[#C4A2AB]">
            → Your welcome page will open automatically.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
